name: Selge TV Premium Build

on:
  workflow_dispatch:

jobs:
  prepare_and_build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Restore Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git ffmpeg libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev libsqlite3-dev libgmp-dev libmpc-dev libmpfr-dev libasound2-dev libgl1-mesa-dev unzip zip

    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        pip install "cython>=0.29.33,<3.0.0" buildozer

    # 🚀 TAKILMAYI ÖNLEYEN KESİNTİSİZ TEK PARÇA CANLI PAKETLEME
    - name: Build Final APK
      run: |
        buildozer -v android debug
      env:
        BUILDOZER_ALLOW_KIVY_NEW_DESIGN: 1
        TERM: xterm
        NONINTERACTIVE: 1
        DEBIAN_FRONTEND: noninteractive

    # 📥 BAŞARIYLA TAMAMLANAN UYGULAMAYI ÇIKARMA
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SelgeTV-Android-APK
        path: bin/*.apk

    

