name: Selge TV Premium Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90  # ⏳ Derlemenin yarıda kesilmesini önlemek için maksimum süre 90 dakikaya çıkarıldı.

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5 # 🛠️ Node 24 uyumluluğu için v5'e yükseltildi.

    - name: Set up JDK 17
      uses: actions/setup-java@v4 # 🛠️ En kararlı ve güncel sürüme çekildi.
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache Android SDK and Buildozer
      uses: actions/cache@v4 # Bu eylem projeniz için mevcut en güncel sürümde kalmıştır.
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libffi-dev \
          libssl-dev \
          autoconf \
          automake \
          libtool \
          pkg-config \
          zlib1g-dev \
          libsqlite3-dev \
          libgmp-dev \
          libmpc-dev \
          libmpfr-dev \
          libasound2-dev \
          libgl1-mesa-dev \
          libgl1-mesa-glx \
          unzip \
          zip

    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        pip install "cython>=0.29.33,<3.0.0"
        pip install buildozer

    - name: Build APK with Buildozer
      run: |
        yes | buildozer android debug
      env:
        BUILDOZER_ALLOW_KIVY_NEW_DESIGN: 1
        TERM: xterm

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4 # 📥 Derleme bittiğinde APK dosyasını "Artifacts" kısmına otomatik yükler.
      with:
        name: SelgeTV-Debug-APK
        path: bin/*.apk
