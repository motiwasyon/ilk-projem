name: Selge TV Premium Build

on:
  workflow_dispatch:

jobs:
  prepare_and_build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git ffmpeg libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev libsqlite3-dev libgmp-dev libmpc-dev libmpfr-dev libasound2-dev libgl1-mesa-dev unzip zip

    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        pip install "cython>=0.29.33,<3.0.0" buildozer

    # 🛠️ GRAFİK KİLİTLENMELERİNİ ENGELLEYEN SABİT AYAR ENJEKSİYONU
    - name: Inject Clean Buildozer Spec
      run: |
        echo "[app]" > buildozer.spec
        echo "title = SelgeTV" >> buildozer.spec
        echo "package.name = selgetv" >> buildozer.spec
        echo "package.domain = org.selge" >> buildozer.spec
        echo "source.dir = ." >> buildozer.spec
        echo "source.include_exts = py,png,jpg,kv,atlas,m3u" >> buildozer.spec
        echo "version = 1.0" >> buildozer.spec
        echo "orientation = landscape" >> buildozer.spec
        echo "requirements = python3,kivy==2.3.0" >> buildozer.spec
        echo "fullscreen = 1" >> buildozer.spec
        echo "android.permissions = INTERNET, WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE" >> buildozer.spec
        echo "android.api = 33" >> buildozer.spec
        echo "android.minapi = 24" >> buildozer.spec
        echo "android.ndk_api = 24" >> buildozer.spec
        echo "android.ndk = 25b" >> buildozer.spec
        echo "android.archs = arm64-v8a" >> buildozer.spec
        echo "p4a.branch = master" >> buildozer.spec

    # 🚀 ANDROID LİSANSLARINI OTOMATİK ONAYLAMA KİLİDİ
    - name: Accept Android Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | buildozer android debug --only-compile-deps || true

    # 🚀 TERMINAL SORGULARINI (STTY) BYPASS EDEN GÜVENLİ DERLEME
    - name: Build Final APK
      run: |
        buildozer -v android debug
      env:
        BUILDOZER_ALLOW_KIVY_NEW_DESIGN: 1
        TERM: xterm
        NONINTERACTIVE: 1
        DEBIAN_FRONTEND: noninteractive
        GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SelgeTV-Android-APK
        path: bin/*.apk


