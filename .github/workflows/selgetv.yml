name: Selge TV Premium Build

on:
  workflow_dispatch:

jobs:
  prepare_and_build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git ffmpeg libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev libsqlite3-dev libgmp-dev libmpc-dev libmpfr-dev libasound2-dev libgl1-mesa-dev unzip zip xvfb

    - name: Install Buildozer, p4a and Cython
      run: |
        python -m pip install --upgrade pip
        pip install "cython>=0.29.33,<3.0.0" buildozer "python-for-android==2024.1.21"

    - name: Inject Clean Buildozer Spec
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = SelgeTV
        package.name = selgetv
        package.domain = org.selgeproje
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,json
        version = 1.7
        source.exclude_dirs = tests, test, bst, bin, venv, env

        requirements = python3==3.11.11,kivy==2.3.0

        orientation = landscape
        fullscreen = 1

        android.accept_sdk_license = True
        android.permissions = INTERNET, ACCESS_NETWORK_STATE, ACCESS_WIFI_STATE, WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE
        android.api = 33
        android.minapi = 26
        android.ndk_api = 26
        android.build_tools_version = 33.0.2
        android.enable_androidx = True

        android.add_compile_options = sourceCompatibility = JavaVersion.VERSION_1_8, targetCompatibility = JavaVersion.VERSION_1_8
        android.manifest.application_arguments = android:usesCleartextTraffic="true"
        android.manifest.intent_filters = [ {"action": "android.intent.action.MAIN", "category": ["android.intent.category.LEANBACK_LAUNCHER", "android.intent.category.LAUNCHER"]} ]
        android.archs = arm64-v8a

        android.p4a_extra_args = --exclude-libs=libestdc++,test,unittest,tkinter,pydoc,distutils,libjxl,brotli,highway,libavif,lcms,lodepng,sjpeg,skcms,googletest --no-deps

        p4a.branch = release-2024.01.21
        android.ndk = 25b
        android.allow_backup = True

        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

    - name: Accept Android Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | buildozer android debug --only-compile-deps || true

    - name: Build Final APK
      run: |
        export TERM=xterm
        export NONINTERACTIVE=1
        export DEBIAN_FRONTEND=noninteractive
        
        sudo chmod -R 777 .
        mkdir -p bin
        sudo chmod -R 777 bin
        
        xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" buildozer -v android debug
      env:
        BUILDOZER_ALLOW_KIVY_NEW_DESIGN: 1
        APP_CYTHON_COMPILE_OPTIONS: "-X legacy_implicit_noexcept=True"
        CFLAGS: "-Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration -Wno-error=int-conversion"
        CXXFLAGS: "-Wno-error=incompatible-pointer-types"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SelgeTV-Android-APK
        path: bin/*.apk

