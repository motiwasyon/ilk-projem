name: Selge TV Premium Build

on:
  workflow_dispatch:

jobs:
  prepare_and_build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git ffmpeg libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev libsqlite3-dev libgmp-dev libmpc-dev libmpfr-dev libasound2-dev libgl1-mesa-dev unzip zip xvfb

    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        pip install "cython>=0.29.33,<3.0.0" buildozer

    # 🛠️ GÜVENLİ VE MANİFEST HATASIZ SIFIR AYAR ENJEKSİYONU
    - name: Inject Clean Buildozer Spec
      run: |
        echo "[app]" > buildozer.spec
        echo "title = SelgeTV" >> buildozer.spec
        echo "package.name = selgetv" >> buildozer.spec
        echo "package.domain = org.selgeproje" >> buildozer.spec
        echo "source.dir = ." >> buildozer.spec
        echo "source.include_exts = py,png,jpg,kv,atlas,json,m3u" >> buildozer.spec
        echo "version = 1.7" >> buildozer.spec
        echo "orientation = landscape" >> buildozer.spec
        echo "requirements = python3,kivy==2.3.0,requests,urllib3,chardet,certifi,idna,ffpyplayer" >> buildozer.spec
        echo "fullscreen = 1" >> buildozer.spec
        echo "android.permissions = INTERNET, ACCESS_NETWORK_STATE, ACCESS_WIFI_STATE, WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE" >> buildozer.spec
        echo "android.api = 33" >> buildozer.spec
        echo "android.minapi = 26" >> buildozer.spec
        echo "android.ndk_api = 26" >> buildozer.spec
        echo "android.ndk = 25b" >> buildozer.spec
        echo "android.enable_androidx = True" >> buildozer.spec
        echo "android.archs = arm64-v8a" >> buildozer.spec
        echo "p4a.branch = release-2024.01.21" >> buildozer.spec

    - name: Accept Android Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | buildozer android debug --only-compile-deps || true

    # 📺 ANDROID TV DESTEĞİNİ KODUN İÇİNDEN MANİFESTE GÜVENLİ ENJEKTE ETME ADIMI
    - name: Patch Android Manifest for Android TV Support
      run: |
        # Temel Android projesinin oluşturulmasını tetikle
        buildozer android intent_filters || true
        
        # python-for-android şablon manifest dosyasını bul ve içine LEANBACK_LAUNCHER kategorisini ekle
        MANIFEST_TEMPLATE=$(find .buildozer/ -name "AndroidManifest.tmpl.xml" | head -n 1)
        if [ -f "$MANIFEST_TEMPLATE" ]; then
          echo "Manifest şablonu bulundu, TV desteği ekleniyor: $MANIFEST_TEMPLATE"
          # LAUNCHER kategorisinin hemen altına LEANBACK_LAUNCHER kategorisini ekle
          sed -i '/<category android:name="android.intent.category.LAUNCHER" \/>/a \                <category android:name="android.intent.category.LEANBACK_LAUNCHER" \/>' "$MANIFEST_TEMPLATE"
        else
          echo "Şablon dosyası henüz oluşmadı, ana derleme adımında otomatik yama denenecek."
        fi

    # 🚀 TAM YETKİLİ PAKETLEME SÜRECİ
    - name: Build Final APK
      run: |
        export TERM=xterm
        export NONINTERACTIVE=1
        export DEBIAN_FRONTEND=noninteractive
        
        sudo chmod -R 777 .
        mkdir -p bin
        sudo chmod -R 777 bin
        
        # Derleme esnasında şablon tekrar üzerine yazılırsa diye yama işlemini sağlama alıyoruz
        xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" bash -c '
          (sleep 30 && MANIFEST_TEMPLATE=$(find .buildozer/ -name "AndroidManifest.tmpl.xml" | head -n 1) && [ -f "$MANIFEST_TEMPLATE" ] && sed -i '"'"'/<category android:name="android.intent.category.LAUNCHER" \/>/a \                <category android:name="android.intent.category.LEANBACK_LAUNCHER" \/>'"'"' "$MANIFEST_TEMPLATE" && echo "Arka plan manifest yaması başarılı.") &
          buildozer -v android debug
        '
      env:
        BUILDOZER_ALLOW_KIVY_NEW_DESIGN: 1
        APP_CYTHON_COMPILE_OPTIONS: "-X legacy_implicit_noexcept=True"
        CFLAGS: "-Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration -Wno-error=int-conversion"
        CXXFLAGS: "-Wno-error=incompatible-pointer-types"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SelgeTV-Android-APK
        path: bin/*.apk
